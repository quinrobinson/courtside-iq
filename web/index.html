<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    Alternatively, build your application passing the --base-href parameter
    specifying the new root path of your web app.

    Fore more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Courtside IQ">

  

  <meta name="robots" content="noindex">

  <!-- Favicon -->
  <link rel="icon" href="favicon-light.svg" sizes="any">
  

  <!-- Open Graph & SEO tags -->
  <meta property="og:title" content="Courtside IQ — Basketball Stat Tracker for AAU, Youth &amp; High School Players ">
  <meta property="og:description" content="Track basketball stats in real time with Courtside IQ. Built for AAU, high school, and youth players, parents, and coaches. Log points, rebounds, assists, and more — game by game, season by season. Free on iOS and Android.">
  <meta property="og:image" content="/assets/assets/images/App_Icon_z.png"> 
  <meta name="twitter:title" content="Courtside IQ — Basketball Stat Tracker for AAU, Youth &amp; High School Players ">
  <meta name="twitter:description" content="Track basketball stats in real time with Courtside IQ. Built for AAU, high school, and youth players, parents, and coaches. Log points, rebounds, assists, and more — game by game, season by season. Free on iOS and Android.">
  <meta name="twitter:image" content="/assets/assets/images/App_Icon_z.png">
  <meta name="twitter:card" content="summary_large_image">

  <title> Courtside IQ — Basketball Stat Tracker for AAU, Youth &amp; High School Players  </title>
  <meta name="description" content="Track basketball stats in real time with Courtside IQ. Built for AAU, high school, and youth players, parents, and coaches. Log points, rebounds, assists, and more — game by game, season by season. Free on iOS and Android.">
    

  <!-- Status Bar color in Safari browser (iOS) and PWA -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f4f8">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#f1f4f8">

  <link rel="manifest" href="manifest.json">
  
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #000000;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #000000;
          }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>
<body>
  
  
  
  
  
  <script>
    {{flutter_bootstrap_js}}
  </script>


</body></html>
